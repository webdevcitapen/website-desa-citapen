components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT yang diperoleh dari /autentikasi/masuk.
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Id data (angka positif).
      schema:
        type: integer
        minimum: 1
    Halaman:
      name: halaman
      in: query
      description: Nomor halaman, dimulai dari 1 (default 1).
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PerHalaman:
      name: perHalaman
      in: query
      description: Jumlah data per halaman, 1 sampai 50 (default 10).
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
  schemas:
    TanggapanSukses:
      type: object
      description: Bentuk dasar semua tanggapan sukses.
      properties:
        status:
          type: string
          example: sukses
        pesan:
          type: string
          description: Pesan ramah untuk pengguna.
        data:
          description: Isi tanggapan, berbeda untuk setiap endpoint.
    TanggapanGagal:
      type: object
      description: Bentuk dasar semua tanggapan gagal.
      properties:
        status:
          type: string
          example: gagal
        pesan:
          type: string
          description: Penjelasan kesalahan dalam Bahasa Indonesia.
        kode:
          type: string
          description: Kode kesalahan singkat untuk penanganan terprogram.
          examples: [DATA_TIDAK_VALID, BELUM_MASUK, TANPA_IZIN]
        detail:
          type: array
          items:
            type: string
          description: Daftar rincian kesalahan (untuk validasi).
    DataKesehatan:
      type: object
      properties:
        layanan:
          type: string
          example: backend-desa-citapen
        database:
          type: string
          enum: [terhubung, tidak terhubung]
        waktu:
          type: string
          format: date-time
    DataBeranda:
      type: object
      properties:
        beritaTerbaru:
          type: array
          items:
            $ref: "#/components/schemas/Berita"
        produkTerbaru:
          type: array
          items:
            $ref: "#/components/schemas/Produk"
        jumlahBerita:
          type: integer
        jumlahProduk:
          type: integer
        jumlahUmkm:
          type: integer
        kesehatanDatabase:
          type: boolean
    HasilMasuk:
      type: object
      properties:
        token:
          type: string
          description: Token JWT; kirim pada header Authorization untuk rute berizin.
        pengguna:
          $ref: "#/components/schemas/Pengguna"
    Pengguna:
      type: object
      description: Data pengguna tanpa kata sandi.
      properties:
        id:
          type: integer
        username:
          type: string
        namaLengkap:
          type: string
        email:
          type: [string, "null"]
        nomorHp:
          type: [string, "null"]
        fotoProfil:
          type: [string, "null"]
          description: Path relatif gambar; lihat catatan URL gambar.
        peran:
          type: string
          enum: [admin, publikasi]
        statusAktif:
          type: boolean
        dibuatPada:
          type: string
          format: date-time
    ProfilDesa:
      type: object
      properties:
        id:
          type: integer
        luasWilayah:
          type: string
        batasUtara:
          type: string
        batasSelatan:
          type: string
        batasBarat:
          type: string
        batasTimur:
          type: string
        letakGeografis:
          type: [string, "null"]
        deskripsiWilayah:
          type: [string, "null"]
        diperbaruiPada:
          type: string
          format: date-time
    ProfilDesaInput:
      type: object
      required: [luasWilayah, batasUtara, batasSelatan, batasBarat, batasTimur]
      properties:
        luasWilayah:
          type: string
          maxLength: 100
        batasUtara:
          type: string
          maxLength: 100
        batasSelatan:
          type: string
          maxLength: 100
        batasBarat:
          type: string
          maxLength: 100
        batasTimur:
          type: string
          maxLength: 100
        letakGeografis:
          type: [string, "null"]
          maxLength: 2000
        deskripsiWilayah:
          type: [string, "null"]
          maxLength: 2000
    StrukturOrganisasi:
      type: object
      properties:
        id:
          type: integer
        nama:
          type: string
        jabatan:
          type: string
        urutan:
          type: integer
        foto:
          type: [string, "null"]
        dibuatPada:
          type: string
          format: date-time
        diperbaruiPada:
          type: string
          format: date-time
    StrukturOrganisasiInput:
      type: object
      required: [nama, jabatan]
      properties:
        nama:
          type: string
          minLength: 2
          maxLength: 100
        jabatan:
          type: string
          minLength: 2
          maxLength: 100
        urutan:
          type: integer
          minimum: 0
          maximum: 1000
    RiwayatKuwu:
      type: object
      properties:
        id:
          type: integer
        nama:
          type: string
        masaJabatan:
          type: string
        urutan:
          type: integer
        keterangan:
          type: [string, "null"]
        dibuatPada:
          type: string
          format: date-time
        diperbaruiPada:
          type: string
          format: date-time
    RiwayatKuwuInput:
      type: object
      required: [nama, masaJabatan]
      properties:
        nama:
          type: string
          minLength: 2
          maxLength: 100
        masaJabatan:
          type: string
          minLength: 2
          maxLength: 100
        urutan:
          type: integer
          minimum: 0
          maximum: 1000
        keterangan:
          type: [string, "null"]
          maxLength: 500
    Penulis:
      type: object
      description: Informasi penulis atau pemilik yang tampil di berita dan produk.
      properties:
        id:
          type: integer
        username:
          type: string
        namaLengkap:
          type: string
        fotoProfil:
          type: [string, "null"]
    Berita:
      type: object
      properties:
        id:
          type: integer
        judul:
          type: string
        isi:
          type: string
        gambar:
          type: [string, "null"]
          description: Path relatif gambar; lihat catatan URL gambar.
        penulis:
          $ref: "#/components/schemas/Penulis"
        dibuatPada:
          type: string
          format: date-time
        diperbaruiPada:
          type: string
          format: date-time
    HasilPaginasiBerita:
      type: object
      properties:
        daftar:
          type: array
          items:
            $ref: "#/components/schemas/Berita"
        halaman:
          type: integer
        perHalaman:
          type: integer
        total:
          type: integer
        totalHalaman:
          type: integer
    Kategori:
      type: object
      properties:
        id:
          type: integer
        nama:
          type: string
        pemilikId:
          type: integer
          description: Id admin desa pemilik kategori.
        dibuatPada:
          type: string
          format: date-time
    Produk:
      type: object
      properties:
        id:
          type: integer
        nama:
          type: string
        harga:
          type: number
          description: Harga dalam rupiah (bisa sangat besar, gunakan bigint jika perlu).
        deskripsi:
          type: string
        foto:
          type: [string, "null"]
          description: Path relatif gambar; lihat catatan URL gambar.
        kategori:
          type: [object, "null"]
          properties:
            id:
              type: integer
            nama:
              type: string
        pemilik:
          $ref: "#/components/schemas/Penulis"
        dibuatPada:
          type: string
          format: date-time
        diperbaruiPada:
          type: string
          format: date-time
    HasilPaginasiProduk:
      type: object
      properties:
        daftar:
          type: array
          items:
            $ref: "#/components/schemas/Produk"
        halaman:
          type: integer
        perHalaman:
          type: integer
        total:
          type: integer
        totalHalaman:
          type: integer
    HasilPaginasiPengguna:
      type: object
      properties:
        daftar:
          type: array
          items:
            $ref: "#/components/schemas/Pengguna"
        halaman:
          type: integer
        perHalaman:
          type: integer
        total:
          type: integer
        totalHalaman:
          type: integer
